  <!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>TYPE PLAY — Blanc Edition (Performance Pro)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            font-size: clamp(10px, 1.1vw, 20px); 
            --bg-viewport: #4D4D4D;
            --sidebar-bg: #ffffff;
            --ui-border: #e5e5e5;
            --text-main: #000000;
            --text-sub: #888888;
            --mint-green: #AAF0D1; 
            --font-nimbus: "Inter", "Nimbus Sans", "Helvetica Neue", sans-serif;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; background: var(--bg-viewport); color: var(--text-main); 
            font-family: var(--font-nimbus); font-weight: 400;
            display: flex; height: 100vh; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .viewport { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .canvas-frame {
            height: 85vh; aspect-ratio: 3 / 4; background: #ffffff; /* 画布默认为白色 */
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #out { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

        .sidebar {
            width: 20rem; height: 100%; border-left: 1px solid var(--ui-border);
            background: var(--sidebar-bg); display: flex; flex-direction: column; z-index: 10;
        }

        .header {
            padding: 2rem 1.5rem; border-bottom: 1px solid var(--ui-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .header .title { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; }
        .lang-switch { font-size: 0.65rem; font-weight: 400; cursor: pointer; color: var(--text-sub); }
        .lang-switch span.active { color: var(--text-main); }

        .scroll-area { flex: 1; overflow-y: auto; padding: 1.5rem; }
        .section { margin-bottom: 2rem; }
        
        .section-header { 
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; 
        }
        .section-title { font-size: 0.6rem; font-weight: 400; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.12em; }
        
        .reset-link { 
            font-size: 0.6rem; font-weight: 400; text-transform: uppercase; 
            cursor: pointer; color: var(--text-sub); border: none; background: none; 
            padding: 0; margin: 0; outline: none; transition: color 0.2s;
        }
        .reset-link:hover { color: var(--text-main); }

        .select-wrapper { position: relative; width: 100%; margin-bottom: 0.8rem; }
        select {
            width: 100%; background: transparent; border: 1px solid var(--ui-border);
            padding: 0.8rem; font-size: 0.65rem; appearance: none; outline: none;
            cursor: pointer; font-family: var(--font-nimbus); text-transform: uppercase; border-radius: 0;
        }
        .select-wrapper::after { content: "↓"; position: absolute; right: 0.8rem; top: 0.75rem; font-size: 0.6rem; color: var(--text-sub); pointer-events: none; }

        .slider-wrap { margin-bottom: 1.5rem; }
        .slider-info { display: flex; justify-content: space-between; font-size: 0.6rem; margin-bottom: 0.6rem; text-transform: uppercase; }
        input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; height: 1.2rem; outline: none; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 1px; background: var(--ui-border); }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 0.6rem; width: 0.6rem; background: #000; border-radius: 50%;
            cursor: pointer; margin-top: -0.28rem;
        }

        .btn {
            width: 100%; background: transparent; border: 1px solid var(--ui-border); padding: 0.9rem;
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em;
            cursor: pointer; transition: 0.2s; margin-bottom: 0.5rem; display: flex; align-items: center; 
            justify-content: center; color: #000; border-radius: 0;
        }
        .btn:hover { background: #000; color: #fff; }
        .btn-black { background: #000; color: #fff; }
        .export-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin-top: 1rem; }

        .color-split-control { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ui-border); height: 2.5rem; }
        .color-preview-half { position: relative; border-right: 1px solid var(--ui-border); cursor: pointer; background-color: var(--mint-green); }
        .color-preview-half input[type="color"] { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .hex-input-half { display: flex; align-items: center; padding: 0 0.6rem; }
        .hex-input-half input { border: none; width: 100%; outline: none; font-size: 0.65rem; background: transparent; text-transform: uppercase; }

        #status { position: fixed; bottom: 1.5rem; left: 1.5rem; font-size: 0.55rem; color: rgba(255,255,255,0.4); display: none; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="status">● PROCESSING</div>

<main class="viewport">
    <div class="canvas-frame" id="canvas-frame">
        <canvas id="out"></canvas>
    </div>
</main>

<aside class="sidebar">
    <div class="header">
        <div class="title">TYPE PLAY</div>
        <div class="lang-switch" onclick="toggleLang()">
            <span id="lang-en" class="active">EN</span> / <span id="lang-cn">CN</span>
        </div>
    </div>
    
    <div class="scroll-area">
        <div class="section">
            <label class="btn btn-black">
                <span data-key="upload">Import File</span>
                <input type="file" id="universal-up" accept="image/*,.glb,.gltf">
            </label>
        </div>

        <div class="section">
            <span class="section-title" data-key="palette">Color Palette</span>
            <div class="select-wrapper" style="margin-top:1rem;">
                <select id="mode-select" onchange="setPalette(this.value)">
                    <option value="ORIGINAL" data-key="opt1">Original Colors</option>
                    <option value="MARKER" data-key="opt2">Classic Marker</option>
                    <option value="BAUHAUS">Bauhaus High-Contrast</option>
                    <option value="NEON">Neon Acid Contrast</option>
                    <option value="SWISS">Swiss Grid Graphic</option>
                    <option value="ACID" data-key="opt3">Acid Contrast</option>
                    <option value="POP" data-key="opt4">Pop Collage</option>
                </select>
            </div>
        </div>

        <div class="section">
            <span class="section-title" data-key="adjust">Adjustment</span>
            <div class="slider-wrap" style="margin-top:1rem;">
                <div class="slider-info"><span data-key="weight">Stroke Weight</span><span id="lh-val">16</span></div>
                <input type="range" id="lh" min="4" max="60" value="16">
            </div>
            <div class="slider-wrap">
                <div class="slider-info"><span data-key="thresh">Threshold</span><span id="th-val">60</span></div>
                <input type="range" id="thresh" min="0" max="250" value="60">
            </div>
            <button id="gap-btn" class="btn" onclick="toggleGap()" data-key="gap">Gap Effect: Off</button>
        </div>

        <div class="section">
            <span class="section-title" data-key="canvasBg">Canvas Color</span>
            <div class="color-split-control" style="margin-top:1rem;">
                <!-- 控件默认薄荷绿 -->
                <div class="color-preview-half" id="color-preview-box">
                    <input type="color" id="bg-color-picker" value="#AAF0D1" oninput="updateRealtimeBg(this.value, 'picker')">
                </div>
                <div class="hex-input-half">
                    <input type="text" id="bg-hex-input" value="#AAF0D1" oninput="updateRealtimeBg(this.value, 'text')">
                </div>
            </div>
        </div>

        <div class="section" style="margin-top: 2rem; border-top: 1px solid var(--ui-border); padding-top: 2rem;">
            <div class="section-header">
                <span class="section-title" data-key="export">Export</span>
                <button class="reset-link" onclick="resetStudio()" data-key="reset">Reset</button>
            </div>
            <div class="export-row">
                <button class="btn" onclick="exportFile('jpg')">JPG</button>
                <button class="btn" onclick="exportFile('png')">PNG</button>
                <button class="btn" onclick="exportSVG()">SVG</button>
            </div>
        </div>
    </div>
</aside>

<canvas id="proc" style="display:none;"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
    const outCanvas = document.getElementById('out'), outCtx = outCanvas.getContext('2d');
    const procCanvas = document.getElementById('proc'), procCtx = procCanvas.getContext('2d', { willReadFrequently: true });
    const statusMsg = document.getElementById('status');
    const TARGET_W = 1500, TARGET_H = 2000;
    outCanvas.width = procCanvas.width = TARGET_W;
    outCanvas.height = procCanvas.height = TARGET_H;

    const PALETTES = {
        ACID: [[0,0,128], [0,255,255], [0,255,0], [255,255,0], [255,128,0], [255,0,128]],
        POP: [[255,73,177], [255,140,0], [154,205,50], [65,105,225], [138,43,226], [255,215,0], [30,30,30]],
        MARKER: { PINK: [255, 73, 177], ORANGE: [255, 140, 0], GREEN: [154, 205, 50], BLUE: [100, 100, 255], DARK: [80, 120, 20] },
        BAUHAUS: [[230,50,40], [40,80,160], [250,200,20], [20,20,20]],
        NEON: [[57,255,20], [255,0,255], [0,255,255], [255,255,0], [255,10,10]],
        SWISS: [[10,10,10], [220,10,10], [50,100,200], [200,200,200]]
    };

    const i18n = {
        en: { upload: "Import File", palette: "Color Palette", opt1: "Original Colors", opt2: "Classic Marker", opt3: "Acid Contrast", opt4: "Pop Collage", adjust: "Adjustment", weight: "Stroke Weight", thresh: "Threshold", gap: "Gap Effect: Off", gapOn: "Gap Effect: On", canvasBg: "Canvas Color", export: "Export", reset: "Reset" },
        cn: { upload: "导入文件", palette: "色彩模式", opt1: "原色渲染", opt2: "经典马克笔", opt3: "酸性对比", opt4: "波普拼贴", adjust: "效果调整", weight: "笔触粗细", thresh: "识别阈值", gap: "缝隙效果：关闭", gapOn: "缝隙效果：开启", canvasBg: "画布底色", export: "导出下载", reset: "重置界面" }
    };

    // 逻辑：导出底色默认白色，控件显示默认薄荷绿
    let currentLang = 'en', paletteMode = 'ORIGINAL', currentSource = null, canvasBgColor = '#ffffff';
    const config = { lh: 16, thresh: 60, hasGap: false };
    
    let renderPending = false;
    function requestDraw() {
        if (renderPending || !currentSource) return;
        renderPending = true;
        requestAnimationFrame(() => { draw(); renderPending = false; });
    }

    function draw() {
        statusMsg.style.display = 'block';
        const baseScale = Math.max(TARGET_W / currentSource.width, TARGET_H / currentSource.height);
        const sw = Math.round(currentSource.width * baseScale), sh = Math.round(currentSource.height * baseScale);
        const imgX = Math.round((TARGET_W - sw) / 2), imgY = Math.round((TARGET_H - sh) / 2);
        procCtx.imageSmoothingEnabled = false;
        procCtx.fillStyle = "white"; procCtx.fillRect(0, 0, TARGET_W, TARGET_H);
        procCtx.drawImage(currentSource, imgX, imgY, sw, sh);
        outCtx.clearRect(0, 0, TARGET_W, TARGET_H);
        const pixels = procCtx.getImageData(0, 0, TARGET_W, TARGET_H).data;
        const gridOffset = imgY % config.lh; 
        const ratio = config.hasGap ? 0.85 : (1.05 + (1 / config.lh)); 
        outCtx.lineWidth = Math.max(2, config.lh * ratio); outCtx.lineCap = 'round';
        for(let y = gridOffset - config.lh; y < TARGET_H + config.lh; y += config.lh) {
            let active = false, startX = 0, lastCol = "";
            const centerY = Math.floor(y + config.lh / 2);
            if(centerY < 0 || centerY >= TARGET_H) continue;
            const rowStart = centerY * TARGET_W * 4;
            for(let x = 0; x < TARGET_W; x += 1) {
                const i = rowStart + x * 4;
                const isSub = (pixels[i+3] > 10 && (pixels[i]+pixels[i+1]+pixels[i+2])/3 < (255 - config.thresh));
                if(isSub) {
                    const col = getColor(pixels[i], pixels[i+1], pixels[i+2]);
                    if(!active) { active = true; startX = x; lastCol = col; }
                    else if(col !== lastCol && x % 4 === 0) { renderLine(startX, x, centerY, lastCol); startX = x; lastCol = col; }
                } else if(active) { active = false; renderLine(startX, x, centerY, lastCol); }
            }
            if(active) renderLine(startX, TARGET_W, centerY, lastCol);
        }
        statusMsg.style.display = 'none';
    }

    function renderLine(x1, x2, y, col) {
        outCtx.beginPath(); outCtx.strokeStyle = col; outCtx.moveTo(x1, y); outCtx.lineTo(x2, y); outCtx.stroke();
    }

    function getColor(r, g, b) {
        if (paletteMode === 'ORIGINAL') return `rgb(${r},${g},${b})`;
        if (paletteMode === 'MARKER') {
            const [h, s, l] = rgbToHsl(r, g, b); const C = PALETTES.MARKER;
            if (h > 330 || h <= 20) return `rgb(${C.PINK.join(',')})`;
            if (h > 20 && h <= 50) return `rgb(${C.ORANGE.join(',')})`;
            if (h > 50 && h <= 150) return l < 0.4 ? `rgb(${C.DARK.join(',')})` : `rgb(${C.GREEN.join(',')})`;
            if (h > 150 && h <= 270) return `rgb(${C.BLUE.join(',')})`;
            return `rgb(${C.PINK.join(',')})`;
        }
        const p = PALETTES[paletteMode] || PALETTES.POP;
        let minD = Infinity, chosen = p[0];
        p.forEach(c => {
            const d = (r-c[0])**2 + (g-c[1])**2 + (b-c[2])**2;
            if(d < minD) { minD = d; chosen = c; }
        });
        return `rgb(${chosen[0]},${chosen[1]},${chosen[2]})`;
    }

    function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            const d = max - min; s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
            else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
            h /= 6;
        }
        return [h * 360, s, l];
    }

    function updateRealtimeBg(val, source) {
        let cleanVal = val;
        if (source === 'text') {
            if (!val.startsWith('#')) cleanVal = '#' + val;
            if (!/^#([A-Fa-f0-9]{3}){1,2}$/.test(cleanVal)) return;
            document.getElementById('bg-color-picker').value = cleanVal;
        } else { document.getElementById('bg-hex-input').value = val.toUpperCase(); }
        canvasBgColor = cleanVal; 
        document.getElementById('canvas-frame').style.backgroundColor = cleanVal; 
        document.getElementById('color-preview-box').style.backgroundColor = cleanVal;
    }

    document.getElementById('universal-up').onchange = function(e) {
        const file = e.target.files[0]; if (!file) return;
        if (file.name.toLowerCase().endsWith('.glb') || file.name.toLowerCase().endsWith('.gltf')) load3DModel(file);
        else {
            const reader = new FileReader();
            reader.onload = (ev) => { const img = new Image(); img.onload = () => { currentSource = img; requestDraw(); }; img.src = ev.target.result; };
            reader.readAsDataURL(file);
        }
    };

    function load3DModel(file) {
        statusMsg.style.display = 'block';
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); renderer.setSize(TARGET_W, TARGET_H);
        const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(45, 3/4, 0.1, 100);
        camera.position.z = 3; scene.add(new THREE.AmbientLight(0xffffff, 2.5));
        new THREE.GLTFLoader().load(URL.createObjectURL(file), gltf => {
            scene.add(gltf.scene); renderer.render(scene, camera);
            currentSource = renderer.domElement; requestDraw();
        });
    }

    function setPalette(val) { paletteMode = val; requestDraw(); }
    function toggleGap() {
        config.hasGap = !config.hasGap;
        document.getElementById('gap-btn').textContent = config.hasGap ? i18n[currentLang].gapOn : i18n[currentLang].gap;
        requestDraw();
    }
    document.getElementById('lh').oninput = (e) => { config.lh = parseInt(e.target.value); document.getElementById('lh-val').textContent = config.lh; requestDraw(); };
    document.getElementById('thresh').oninput = (e) => { config.thresh = parseInt(e.target.value); document.getElementById('th-val').textContent = config.thresh; requestDraw(); };

    function exportFile(fmt) {
        if(!currentSource) return;
        const a = document.createElement('a');
        if (fmt === 'png') a.href = outCanvas.toDataURL('image/png');
        else {
            const temp = document.createElement('canvas'); temp.width = TARGET_W; temp.height = TARGET_H;
            const tCtx = temp.getContext('2d'); tCtx.fillStyle = canvasBgColor; tCtx.fillRect(0,0,TARGET_W,TARGET_H);
            tCtx.drawImage(outCanvas, 0, 0); a.href = temp.toDataURL('image/jpeg', 0.95);
        }
        a.download = `type-play.${fmt}`; a.click();
    }

    function exportSVG() {
        if(!currentSource) return;
        statusMsg.style.display = 'block';
        const pixels = procCtx.getImageData(0, 0, TARGET_W, TARGET_H).data;
        const ratio = config.hasGap ? 0.85 : (1.05 + (1 / config.lh)); 
        const h = Math.max(2, config.lh * ratio), r = h / 2;
        const baseScale = Math.max(TARGET_W / currentSource.width, TARGET_H / currentSource.height);
        const sh = Math.round(currentSource.height * baseScale);
        const imgY = Math.round((TARGET_H - sh) / 2);
        const gridOffset = imgY % config.lh;
        let svgBody = "";
        for(let y = gridOffset - config.lh; y < TARGET_H + config.lh; y += config.lh) {
            let active = false, startX = 0, lastCol = ""; 
            const centerY = Math.floor(y + config.lh / 2);
            if(centerY < 0 || centerY >= TARGET_H) continue;
            for(let x = 0; x < TARGET_W; x++) {
                const i = (centerY * TARGET_W + x) * 4;
                const isSub = (pixels[i+3] > 10 && (pixels[i]+pixels[i+1]+pixels[i+2])/3 < (255 - config.thresh));
                if(isSub) {
                    const col = getColor(pixels[i], pixels[i+1], pixels[i+2]);
                    if(!active) { active = true; startX = x; lastCol = col; }
                    else if(x % 4 === 0 && col !== lastCol) { 
                        svgBody += generateCapsulePath(startX, x, centerY, r, lastCol);
                        startX = x; lastCol = col; 
                    }
                } else if(active) { active = false; svgBody += generateCapsulePath(startX, x, centerY, r, lastCol); }
            }
            if(active) svgBody += generateCapsulePath(startX, TARGET_W, centerY, r, lastCol);
        }
        const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="${TARGET_W}" height="${TARGET_H}" viewBox="0 0 ${TARGET_W} ${TARGET_H}"><g shape-rendering="geometricPrecision">${svgBody}</g></svg>`;
        const a = document.createElement('a'); 
        a.href = URL.createObjectURL(new Blob([svgContent], {type: "image/svg+xml;charset=utf-8"})); 
        a.download = `type-play-filled.svg`; a.click();
        statusMsg.style.display = 'none';
    }

    function generateCapsulePath(x1, x2, y, r, color) {
        const d = `M${x1},${y - r} L${x2},${y - r} A${r},${r} 0 0 1 ${x2},${y + r} L${x1},${y + r} A${r},${r} 0 0 1 ${x1},${y - r} Z`;
        return `<path d="${d}" fill="${color}" />`;
    }

    function resetStudio() {
        currentSource = null;
        paletteMode = 'ORIGINAL';
        canvasBgColor = '#ffffff'; // 内部逻辑恢复白色
        config.lh = 16;
        config.thresh = 60;
        config.hasGap = false;

        outCtx.clearRect(0, 0, TARGET_W, TARGET_H);
        procCtx.clearRect(0, 0, TARGET_W, TARGET_H);

        document.getElementById('universal-up').value = "";
        document.getElementById('mode-select').value = 'ORIGINAL';
        document.getElementById('lh').value = 16;
        document.getElementById('lh-val').textContent = 16;
        document.getElementById('thresh').value = 60;
        document.getElementById('th-val').textContent = 60;
        document.getElementById('gap-btn').textContent = i18n[currentLang].gap;
        
        // UI恢复薄荷绿，但画布恢复白色
        document.getElementById('bg-color-picker').value = '#AAF0D1';
        document.getElementById('bg-hex-input').value = '#AAF0D1';
        document.getElementById('canvas-frame').style.backgroundColor = '#ffffff'; 
        document.getElementById('color-preview-box').style.backgroundColor = '#AAF0D1';
        
        statusMsg.style.display = 'none';
    }

    function toggleLang() {
        currentLang = currentLang === 'en' ? 'cn' : 'en';
        document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
        document.getElementById('lang-cn').classList.toggle('active', currentLang === 'cn');
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            el.textContent = i18n[currentLang][key];
        });
        document.getElementById('gap-btn').textContent = config.hasGap ? i18n[currentLang].gapOn : i18n[currentLang].gap;
    }
</script>
</body>
</html>
